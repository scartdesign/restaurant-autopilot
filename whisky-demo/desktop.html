<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whisky Sales Platform — Desktop</title>
<style>
:root{--n:#081b35;--g:#c7a45e;--bg:#f4f6fa;--line:#dbe3ee;--mut:#6e7d92}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17253a}button,input{font:inherit}.app{max-width:1440px;margin:auto;background:#fff;min-height:100vh}.top{background:var(--n);color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 28px;gap:24px}.search{display:flex;background:#fff;border-radius:10px;overflow:hidden}.search input{border:0;outline:0;padding:12px;flex:1}.search button{border:0;background:var(--g);font-weight:900;padding:0 18px}.logo img{width:220px;height:84px;object-fit:contain}.actions{display:flex;justify-content:flex-end;gap:8px;align-items:center}.pill,.icon{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:9px 12px;font-weight:900;cursor:pointer}.pill.active{background:#fff;color:var(--n)}.icon{border-radius:10px;position:relative}.badge{position:absolute;right:-6px;top:-7px;background:var(--g);color:var(--n);border-radius:50%;min-width:18px;height:18px;display:grid;place-items:center;font-size:10px}.modes{display:flex;justify-content:center;gap:8px;background:#f7f0e2;padding:10px}.modes button{border:1px solid #dacaa4;background:#fff;color:var(--n);border-radius:999px;padding:10px 22px;font-weight:900;cursor:pointer}.modes button.active{background:var(--n);color:#e4c675}.nav{display:flex;justify-content:center;gap:26px;padding:13px;border-bottom:1px solid var(--line)}.nav button{border:0;background:none;font-weight:900;color:#516078;cursor:pointer}.nav button.active{color:var(--g)}.view{display:none}.view.active{display:block}.hero{min-height:385px;background:linear-gradient(90deg,rgba(8,27,53,.95),rgba(8,27,53,.35)),url('https://www.whisky-bibliothek.ch/wp-content/uploads/2024/01/Untitled-1sss.jpg') center/cover;color:#fff;padding:65px 7%;display:flex;align-items:center}.hero h1{font:500 58px/1.02 Georgia,serif;margin:0 0 14px;max-width:780px}.hero p{font-size:18px;line-height:1.6;max-width:720px;color:#edf1f6}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:900;cursor:pointer}.gold{background:var(--g);color:var(--n)}.white{background:#fff;color:var(--n);border:1px solid var(--line)}.section{padding:34px 28px}.section h2{font:500 36px Georgia,serif;margin:0 0 18px;color:var(--n)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.img{height:220px;background:#f6f8fa;display:grid;place-items:center;padding:18px}.img img{max-width:100%;max-height:100%;object-fit:contain}.body{padding:15px}.k{font-size:10px;color:var(--g);font-weight:900;text-transform:uppercase;letter-spacing:.08em}.body h3{font-size:15px;min-height:40px}.price{font-size:22px;font-weight:900;color:var(--n);margin:12px 0}.add{width:100%;border:0;border-radius:8px;background:var(--n);color:#e5c878;padding:11px;font-weight:900;cursor:pointer}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.finder{display:grid;grid-template-columns:1fr 1fr;gap:18px}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px;margin:8px 0;cursor:pointer}.option.sel{border-color:var(--g);background:#fff8e6;font-weight:900}.samplegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.sample{display:grid;grid-template-columns:100px 1fr;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px}.sample img{width:100px;height:100px;object-fit:contain;background:#f7f8fa}.crm{display:none;background:#f5f7fa;padding:28px}.crm.active{display:block}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.kpi span{font-size:11px;color:var(--mut)}.kpi strong{display:block;font-size:28px;color:var(--n);margin-top:5px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.row{padding:10px;border-left:3px solid var(--g);background:#fafbfd;margin:8px 0}.row strong{display:block;font-size:13px}.row small{color:var(--mut)}.cart{position:fixed;right:20px;top:100px;width:380px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25);border-radius:14px;padding:16px;display:none;z-index:50}.cart.open{display:block}.cartrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.qty{display:flex;gap:6px;align-items:center;margin-top:4px}.qty button{width:25px;height:25px;border:1px solid var(--line);background:#fff;border-radius:6px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.top{grid-template-columns:1fr}.actions{justify-content:center}.search{display:none}.finder{grid-template-columns:1fr}}
</style></head><body><div class="app">
<div class="top"><div class="search"><input id="searchInput"><button id="searchBtn"></button></div><div class="logo"><img src="https://www.whisky-bibliothek.ch/wp-content/uploads/2020/07/Whisky-Bibliothek-logo.png"></div><div class="actions"><button id="deBtn" class="pill active">DE</button><button id="enBtn" class="pill">EN</button><button class="icon">♡</button><button id="cartBtn" class="icon">🛒<span id="badge" class="badge">0</span></button></div></div>
<div class="modes"><button id="custMode" class="active"></button><button id="crmMode"></button></div>
<div id="customerArea"><nav class="nav" id="nav"><button data-view="home" class="active">Home</button><button data-view="shop">Shop</button><button data-view="finder">Whisky Finder</button><button data-view="samples" id="navSamples"></button><button data-view="profile" id="navProfile"></button></nav>
<section id="home" class="view active"><div class="hero"><div><div class="k">WHISKY BIBLIOTHEK · SALES PLATFORM</div><h1 id="heroTitle"></h1><p id="heroText"></p><button class="btn gold" data-view="finder" id="finderCta"></button></div></div><div class="section"><h2 id="newStock"></h2><div id="homeGrid" class="grid"></div></div></section>
<section id="shop" class="view"><div class="section"><h2>Shop</h2><div id="shopGrid" class="grid"></div></div></section>
<section id="finder" class="view"><div class="section"><h2>Whisky Finder</h2><div class="finder"><div class="panel"><div class="k" id="stepLabel"></div><h3 id="question"></h3><div id="options"></div><div style="display:flex;gap:8px"><button id="prevBtn" class="btn white"></button><button id="nextBtn" class="btn gold"></button></div></div><div class="panel"><h3 id="recTitle"></h3><p id="recText"></p><div id="recommendation"></div></div></div></div></section>
<section id="samples" class="view"><div class="section"><h2 id="samplesTitle"></h2><div id="sampleGrid" class="samplegrid"></div></div></section>
<section id="profile" class="view"><div class="section"><h2 id="profileTitle"></h2><div class="panel"><h3>Marco Huber</h3><div class="row">Sherry 82%</div><div class="row">Campbeltown 77%</div><div class="row">Smoky 68%</div></div></div></section></div>
<section id="crmArea" class="crm"><h2 id="crmTitle" style="font:500 38px Georgia,serif;color:var(--n);margin-top:0"></h2><div class="kpis"><div class="kpi"><span id="customersLabel"></span><strong>1,284</strong></div><div class="kpi"><span id="subsLabel"></span><strong>976</strong></div><div class="kpi"><span id="segmentsLabel"></span><strong>12</strong></div><div class="kpi"><span id="revenueLabel"></span><strong>CHF 18.4k</strong></div></div><div class="cols"><div class="panel"><h3 id="attentionTitle"></h3><div class="row"><strong id="att1"></strong><small>Sample → Bottle</small></div><div class="row"><strong id="att2"></strong><small>Back in stock</small></div><div class="row"><strong id="att3"></strong><small>VIP opportunity</small></div></div><div class="panel"><h3 id="autoTitle"></h3><div class="row">Probe → Flasche / Sample → Bottle <button class="btn white" onclick="alert('Automation ✓')">Run now</button></div><div class="row">Wishlist Back in Stock <button class="btn white" onclick="alert('Automation ✓')">Run now</button></div><div class="row">VIP / Collector Alert <button class="btn white" onclick="alert('Automation ✓')">Run now</button></div></div></div></section>
<div id="cart" class="cart"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="cartTitle"></h3><button id="closeCart" style="border:0;background:none;font-size:24px">×</button></div><div id="cartRows"></div><div class="price" id="cartTotal">0.00 CHF</div></div>
</div><script>
const P=[
{k:'ard',de:'Ardmore 28 Jahre',en:'Ardmore 28 Years',r:'Highland',p:259,img:'https://www.whisky-bibliothek.ch/wp-content/uploads/2026/09/Ardmore-28yo_chapter-one_front.jpg'},
{k:'led',de:'Ledaig 18 Jahre',en:'Ledaig 18 Years',r:'Islands',p:149,img:'https://www.whisky-bibliothek.ch/wp-content/uploads/2026/09/Ledaig-Tobermory-18-years-C.Dully-Selection-56.8-Sherry-Butt-Cask-no.-700260-239-Bottles-Islands-Mull-Single-Mail-Scotch-Whisky.jpg'},
{k:'kil',de:'Kilkerran 16 Jahre',en:'Kilkerran 16 Years',r:'Campbeltown',p:85,img:'https://www.whisky-bibliothek.ch/wp-content/uploads/2026/09/Kilkerran-16y-46-2026-100-Sherry-Glengyle-Campbeltown-Single-Malt-Whisky.jpg'},
{k:'spr',de:'Springbank 1994 Jahrgang',en:'Springbank 1994 Vintage',r:'Campbeltown',p:89,img:'https://www.whisky-bibliothek.ch/wp-content/uploads/2026/08/Springbank-31-years-old-1994-80-Bourbon-10-Sherry-10-Red-Wine-451-vol.-1180-bottles-Campbeltown-Single-Malt-Whisky.jpg'}];
const T={de:{cust:'Kunden-App',crm:'Vertrieb / CRM',search:'Produkte, Destillerien, Regionen suchen...',searchBtn:'Suche',hero:'Ihr persönlicher Whiskyberater.',herot:'Intelligente Empfehlungen, Proben, seltene Flaschen und automatisierte Verkaufsprozesse – auf Deutsch und Englisch.',finder:'Whisky Finder starten',new:'Neu im Sortiment',samples:'Proben',profile:'Mein Profil',step:'Schritt',back:'Zurück',next:'Weiter',rec:'Ihre Empfehlung',rect:'Nach Ihren Antworten schlägt die Plattform passende Whiskys vor.',customers:'Kunden',subs:'E-Mail-Abonnenten',segments:'Segmente',revenue:'Beeinflusster Umsatz',attention:'Benötigt Aufmerksamkeit',att1:'17 Probenkäufer ohne Flaschenkauf',att2:'11 Wunschlisten-Produkte wieder verfügbar',att3:'6 VIP-Kunden sehen seltene Flaschen',auto:'Automatisierungen',cart:'Warenkorb',add:'In den Warenkorb'},en:{cust:'Customer App',crm:'Sales / CRM',search:'Search products, distilleries, regions...',searchBtn:'Search',hero:'Your personal whisky advisor.',herot:'Smart recommendations, samples, rare bottles and automated sales workflows — in German and English.',finder:'Start Whisky Finder',new:'New in Stock',samples:'Samples',profile:'My Profile',step:'Step',back:'Back',next:'Next',rec:'Your Recommendation',rect:'Based on your answers, the platform recommends matching whiskies.',customers:'Customers',subs:'Email Subscribers',segments:'Segments',revenue:'Revenue Influenced',attention:'Needs Attention',att1:'17 sample buyers without bottle purchase',att2:'11 wishlist products back in stock',att3:'6 VIP customers viewing rare bottles',auto:'Automations',cart:'Cart',add:'Add to Cart'}};
const Q={de:[['Was ist Ihnen am wichtigsten?',['Geschmack','Region','Preis','Anlass']],['Welcher Stil gefällt Ihnen?',['Rauchig','Sherry','Fruchtig','Mild']],['Welche Region?',['Islay','Campbeltown','Highlands','Speyside']],['Ihr Budget?',['< 80 CHF','80–150 CHF','150–300 CHF','300+ CHF']],['Was suchen Sie?',['Flasche','Proben','Geschenk','Rarität']]],en:[['What matters most?',['Taste','Region','Price','Occasion']],['Which style?',['Smoky','Sherry','Fruity','Soft']],['Which region?',['Islay','Campbeltown','Highlands','Speyside']],['Your budget?',['< 80 CHF','80–150 CHF','150–300 CHF','300+ CHF']],['What are you looking for?',['Bottle','Samples','Gift','Rare bottle']]]};
let L='de',cart=[],step=0,answers={};const $=id=>document.getElementById(id);
function text(){const t=T[L];$('custMode').textContent=t.cust;$('crmMode').textContent=t.crm;$('searchInput').placeholder=t.search;$('searchBtn').textContent=t.searchBtn;$('heroTitle').textContent=t.hero;$('heroText').textContent=t.herot;$('finderCta').textContent=t.finder;$('newStock').textContent=t.new;$('navSamples').textContent=t.samples;$('navProfile').textContent=t.profile;$('samplesTitle').textContent=t.samples;$('profileTitle').textContent=t.profile;$('prevBtn').textContent=t.back;$('nextBtn').textContent=t.next;$('recTitle').textContent=t.rec;$('recText').textContent=t.rect;$('crmTitle').textContent=t.crm;$('customersLabel').textContent=t.customers;$('subsLabel').textContent=t.subs;$('segmentsLabel').textContent=t.segments;$('revenueLabel').textContent=t.revenue;$('attentionTitle').textContent=t.attention;$('att1').textContent=t.att1;$('att2').textContent=t.att2;$('att3').textContent=t.att3;$('autoTitle').textContent=t.auto;$('cartTitle').textContent=t.cart;renderProducts();renderFinder();renderCart()}
function renderProducts(){const html=P.map(x=>'<article class="card"><div class="img"><img src="'+x.img+'"></div><div class="body"><div class="k">'+x.r+'</div><h3>'+x[L]+'</h3><div class="price">'+x.p.toFixed(2)+' CHF</div><button class="add" onclick="add(\''+x.k+'\')">'+T[L].add+'</button></div></article>').join('');$('homeGrid').innerHTML=html;$('shopGrid').innerHTML=html;$('sampleGrid').innerHTML=P.map(x=>'<div class="sample"><img src="'+x.img+'"><div><div class="k">Sample</div><b>'+x[L]+'</b><div class="price">'+(x.k==='kil'?12.5:x.k==='led'?16:x.k==='ard'?24:89).toFixed(2)+' CHF</div></div></div>').join('')}
function lang(l){L=l;$('deBtn').classList.toggle('active',l==='de');$('enBtn').classList.toggle('active',l==='en');document.documentElement.lang=l;text()}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));window.scrollTo({top:0,behavior:'smooth'})}
function mode(m){$('customerArea').style.display=m==='customer'?'block':'none';$('crmArea').classList.toggle('active',m==='crm');$('custMode').classList.toggle('active',m==='customer');$('crmMode').classList.toggle('active',m==='crm')}
function add(k){const p=P.find(x=>x.k===k),e=cart.find(x=>x.k===k);e?e.q++:cart.push({...p,q:1});renderCart()}
function renderCart(){let total=0;$('cartRows').innerHTML=cart.length?cart.map(i=>{total+=i.p*i.q;return '<div class="cartrow"><div><b>'+i[L]+'</b><div class="qty"><button onclick="cq(\''+i.k+'\',-1)">−</button><span>'+i.q+'</span><button onclick="cq(\''+i.k+'\',1)">+</button></div></div><b>'+(i.p*i.q).toFixed(2)+' CHF</b></div>'}).join(''):'<p>'+(L==='de'?'Warenkorb ist leer.':'Cart is empty.')+'</p>';$('cartTotal').textContent=total.toFixed(2)+' CHF';$('badge').textContent=cart.reduce((s,i)=>s+i.q,0)}
function cq(k,d){const i=cart.find(x=>x.k===k);if(!i)return;i.q+=d;if(i.q<=0)cart=cart.filter(x=>x.k!==k);renderCart()}
function renderFinder(){const q=Q[L][step];$('stepLabel').textContent=T[L].step+' '+(step+1)+' / 5';$('question').textContent=q[0];$('options').innerHTML=q[1].map(o=>'<button class="option '+(answers[step]===o?'sel':'')+'" onclick="pick(\''+o.replace(/'/g,"\'")+'\')">'+o+'</button>').join('');$('recommendation').innerHTML='<div class="row"><strong>'+P[2][L]+'</strong><small>Campbeltown · 85.00 CHF</small></div>'}
function pick(o){answers[step]=o;renderFinder()}function next(){if(step<4)step++;renderFinder()}function prev(){if(step>0)step--;renderFinder()}function cartOpen(){$('cart').classList.toggle('open')}
$('deBtn').onclick=()=>lang('de');$('enBtn').onclick=()=>lang('en');$('custMode').onclick=()=>mode('customer');$('crmMode').onclick=()=>mode('crm');$('cartBtn').onclick=cartOpen;$('closeCart').onclick=cartOpen;$('prevBtn').onclick=prev;$('nextBtn').onclick=next;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));text();
</script></body></html>
