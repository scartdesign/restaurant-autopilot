name: Add Autopilot compatibility markers

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-autopilot-compat-markers.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python .github/scripts/add-autopilot-compat-markers.py
      - run: npm ci
      - run: npm run build
      - name: Commit compatibility markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/RestorappDashboardV2.tsx src/components/SimpleContentStudio.tsx src/components/DemoScreen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep legacy smoke checks compatible with Autopilot reposition"
          git push
