name: Reposition Restorapp Autopilot

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/reposition-autopilot.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reposition product around weekly Autopilot
        run: python .github/scripts/reposition-autopilot.py
      - run: npm ci
      - run: npm run build
      - name: Commit product reposition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/RestorappDashboardV2.tsx src/components/SimpleContentStudio.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Reposition Restorapp around weekly marketing Autopilot"
          git push
