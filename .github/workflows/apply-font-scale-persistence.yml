name: Apply font scale persistence patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-font-scale-persistence.yml'
      - '.github/scripts/apply-font-scale-persistence.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply deterministic source patch
        run: python .github/scripts/apply-font-scale-persistence.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/components/RestaurantTemplateCanvas.tsx src/components/SimpleContentStudio.tsx src/studio-download.ts
          git diff --cached --quiet && exit 0
          git commit -m "Persist font size per Content Studio post"
          git push
