name: Stabilize weekly Autopilot

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/stabilize-weekly-autopilot.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python .github/scripts/stabilize-weekly-autopilot.py
      - run: npm ci
      - run: npm run build
      - name: Commit compatibility markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/restaurant-template-pack.css src/components/DemoScreen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize weekly Autopilot regression compatibility"
          git push
