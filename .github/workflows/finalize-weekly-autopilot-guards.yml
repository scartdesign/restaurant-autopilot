name: Finalize weekly Autopilot guards

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finalize-weekly-autopilot-guards.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python .github/scripts/finalize-weekly-autopilot-guards.py
      - run: npm ci
      - run: npm run build
      - name: Commit guard compatibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SimpleContentStudio.tsx src/simple-content-studio.css
          git diff --cached --quiet && exit 0
          git commit -m "Finalize weekly Autopilot guard compatibility"
          git push
