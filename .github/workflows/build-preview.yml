name: Build Preview Files

on:
  push:
    branches: [main]
    paths-ignore:
      - 'preview-app/**'
  workflow_dispatch:

concurrency:
  group: build-preview-main-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Publish compiled app into repository
        run: |
          rm -rf preview-app
          mkdir -p preview-app
          cp -R dist/. preview-app/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-app package-lock.json
          if git diff --cached --quiet; then
            echo "Preview already current"
          else
            git commit -m "Update compiled preview"
            git push
          fi
      - name: Smoke test immutable public preview
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          BASE="https://raw.githack.com/scartdesign/restaurant-autopilot/$SHA/preview-app"

          require_file_text() {
            local file="$1"
            local text="$2"
            if ! grep -Fq -- "$text" "$file"; then
              echo "Missing preview marker in $file: $text"
              exit 1
            fi
          }

          require_bundle_text() {
            local text="$1"
            if ! grep -R -Fq --include='*.js' -- "$text" preview-app/assets; then
              echo "Missing compiled bundle marker: $text"
              exit 1
            fi
          }

          # Validate the complete local production bundle. This avoids depending on
          # Vite lazy-chunk naming while still verifying what is actually published.
          for marker in \
            'RESTORAPP STUDIO' \
            'Autopilot ili ručno. Sve na jednom mestu.' \
            'Ova nedelja' \
            'Kreiraj objavu' \
            'DIZAJN OBJAVE' \
            'FINALNI PREVIEW' \
            'PALETA' \
            'TIPOGRAFIJA' \
            'Noir Signature' \
            'Hero Dish' \
            'Magazine Plate' \
            'Studio White' \
            'Street Impact' \
            'Chef Split' \
            'Night Poster' \
            'Offer Glass' \
            'Menu Select' \
            'Flash Offer' \
            'Lunch Window' \
            'Warm Table' \
            'Great Vibes' \
            'Bebas' \
            '--rt-base-font' \
            '--rt-script-font' \
            'rtpl-safe-copy' \
            'Pregledaj. Zakaži. Gotovo.' \
            'Poveži Instagram + Facebook'; do
            require_bundle_text "$marker"
          done

          if grep -R -Fq --include='*.js' -- 'Restaurant Autopilot' preview-app/assets; then
            echo "Legacy customer-facing brand found in compiled app"
            exit 1
          fi

          # Validate that the immutable public preview is actually being served.
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/html.headers "$BASE/index.html" -o /tmp/app.html
          tr -d '\r' < /tmp/html.headers > /tmp/html.clean
          grep -Eiq '^content-type: *text/html' /tmp/html.clean
          require_file_text /tmp/app.html '<div id="root"></div>'
          require_file_text /tmp/app.html 'Restorapp'

          JS_PATH=$(grep -oE 'src="./assets/[^"]+\.js"' /tmp/app.html | head -1 | cut -d'"' -f2)
          CSS_PATH=$(grep -oE 'href="./assets/[^"]+\.css"' /tmp/app.html | head -1 | cut -d'"' -f2)
          test -n "$JS_PATH"
          test -n "$CSS_PATH"
          JS_PATH="${JS_PATH#./}"
          CSS_PATH="${CSS_PATH#./}"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/js.headers "$BASE/$JS_PATH" -o /tmp/app.js
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/css.headers "$BASE/$CSS_PATH" -o /tmp/app.css
          tr -d '\r' < /tmp/js.headers > /tmp/js.clean
          tr -d '\r' < /tmp/css.headers > /tmp/css.clean
          grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' /tmp/js.clean
          grep -Eiq '^content-type: *text/css' /tmp/css.clean
          test -s /tmp/app.js
          test -s /tmp/app.css
          require_file_text /tmp/app.js 'Restorapp'

          echo "Restorapp current Studio + Autopilot compiled bundle OK"
          echo "Public preview OK: $BASE/index.html"
