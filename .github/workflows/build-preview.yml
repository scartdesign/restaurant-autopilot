name: Build Preview Files

on:
  push:
    branches: [main]
    paths-ignore:
      - 'preview-app/**'
  workflow_dispatch:

concurrency:
  group: build-preview-main-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Publish compiled app into repository
        run: |
          rm -rf preview-app
          mkdir -p preview-app
          cp -R dist/. preview-app/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-app package-lock.json
          if git diff --cached --quiet; then
            echo "Preview already current"
          else
            git commit -m "Update compiled preview"
            git push
          fi
      - name: Smoke test immutable public preview
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          BASE="https://raw.githack.com/scartdesign/restaurant-autopilot/$SHA/preview-app"

          require_text() {
            local file="$1"
            local text="$2"
            if ! grep -Fq -- "$text" "$file"; then
              echo "Missing preview marker in $file: $text"
              exit 1
            fi
          }

          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/html.headers "$BASE/index.html" -o /tmp/app.html
          tr -d '\r' < /tmp/html.headers > /tmp/html.clean
          grep -Eiq '^content-type: *text/html' /tmp/html.clean
          require_text /tmp/app.html '<div id="root"></div>'
          require_text /tmp/app.html 'Restorapp'
          if grep -Fq 'Restaurant Autopilot' /tmp/app.html; then
            echo "Legacy customer-facing brand found in preview HTML"
            exit 1
          fi

          JS_PATH=$(grep -oE 'src="./assets/[^"]+\.js"' /tmp/app.html | head -1 | cut -d'"' -f2)
          CSS_PATH=$(grep -oE 'href="./assets/[^"]+\.css"' /tmp/app.html | head -1 | cut -d'"' -f2)
          test -n "$JS_PATH"
          test -n "$CSS_PATH"
          JS_PATH="${JS_PATH#./}"
          CSS_PATH="${CSS_PATH#./}"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/js.headers "$BASE/$JS_PATH" -o /tmp/app.js
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/css.headers "$BASE/$CSS_PATH" -o /tmp/app.css
          tr -d '\r' < /tmp/js.headers > /tmp/js.clean
          tr -d '\r' < /tmp/css.headers > /tmp/css.clean
          grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' /tmp/js.clean
          grep -Eiq '^content-type: *text/css' /tmp/css.clean
          test -s /tmp/app.js
          test -s /tmp/app.css
          require_text /tmp/app.js 'Restorapp'
          if grep -Fq 'Restaurant Autopilot' /tmp/app.js; then
            echo "Legacy customer-facing brand found in compiled app"
            exit 1
          fi

          CONTENT_CHUNK=$(grep -oE 'SimpleContentStudio-[A-Za-z0-9_-]+\.js' /tmp/app.js | head -1)
          test -n "$CONTENT_CHUNK"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$BASE/assets/$CONTENT_CHUNK" -o /tmp/content.js
          for marker in \
            'RESTORAPP STUDIO' \
            'Autopilot ili ručno. Sve na jednom mestu.' \
            'Ova nedelja' \
            'Kreiraj objavu' \
            'DIZAJN OBJAVE' \
            'FINALNI PREVIEW' \
            'PALETA' \
            'TIPOGRAFIJA' \
            'Noir Signature' \
            'Hero Dish' \
            'Magazine Plate' \
            'Studio White' \
            'Street Impact' \
            'Chef Split' \
            'Night Poster' \
            'Offer Glass' \
            'Menu Select' \
            'Flash Offer' \
            'Lunch Window' \
            'Warm Table'; do
            require_text /tmp/content.js "$marker"
          done

          SHARED_CONTENT_CHUNK=$(grep -oE 'simple-content-studio-[A-Za-z0-9_-]+\.js' /tmp/app.js | head -1)
          test -n "$SHARED_CONTENT_CHUNK"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$BASE/assets/$SHARED_CONTENT_CHUNK" -o /tmp/content-shared.js
          require_text /tmp/content-shared.js 'Great Vibes'
          require_text /tmp/content-shared.js 'Bebas'
          require_text /tmp/content-shared.js '--rt-base-font'
          require_text /tmp/content-shared.js '--rt-script-font'
          require_text /tmp/content-shared.js 'rtpl-safe-copy'

          PUBLISH_CHUNK=$(grep -oE 'PublishCenter-[A-Za-z0-9_-]+\.js' /tmp/app.js | head -1)
          test -n "$PUBLISH_CHUNK"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$BASE/assets/$PUBLISH_CHUNK" -o /tmp/publish.js
          require_text /tmp/publish.js 'Pregledaj. Zakaži. Gotovo.'
          require_text /tmp/publish.js 'Poveži Instagram + Facebook'

          echo "Restorapp current Studio + Autopilot preview markers OK"
          echo "Public preview OK: $BASE/index.html"
