name: Build Preview Files

on:
  push:
    branches: [main]
    paths-ignore:
      - 'preview-app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Publish compiled app into repository
        run: |
          rm -rf preview-app
          mkdir -p preview-app
          cp -R dist/. preview-app/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-app
          if git diff --cached --quiet; then
            echo "Preview already current"
          else
            git commit -m "Update compiled preview"
            git push
          fi
