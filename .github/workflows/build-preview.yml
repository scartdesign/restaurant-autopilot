name: Build Preview Files

on:
  push:
    branches: [main]
    paths-ignore:
      - 'preview-app/**'
  workflow_dispatch:

concurrency:
  group: build-preview-main-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Publish compiled app into repository
        run: |
          rm -rf preview-app
          mkdir -p preview-app
          cp -R dist/. preview-app/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-app package-lock.json
          if git diff --cached --quiet; then
            echo "Preview already current"
          else
            git commit -m "Update compiled preview"
            git push
          fi
      - name: Smoke test immutable public preview
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          BASE="https://raw.githack.com/scartdesign/restaurant-autopilot/$SHA/preview-app"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/html.headers "$BASE/index.html" -o /tmp/app.html
          tr -d '\r' < /tmp/html.headers > /tmp/html.clean
          grep -Eiq '^content-type: *text/html' /tmp/html.clean
          grep -Fq '<div id="root"></div>' /tmp/app.html
          grep -Fq 'Restorapp' /tmp/app.html
          if grep -Fq 'Restaurant Autopilot' /tmp/app.html; then
            echo "Legacy customer-facing brand found in preview HTML"
            exit 1
          fi
          JS_PATH=$(grep -oE 'src="./assets/[^"]+\.js"' /tmp/app.html | head -1 | cut -d'"' -f2)
          CSS_PATH=$(grep -oE 'href="./assets/[^"]+\.css"' /tmp/app.html | head -1 | cut -d'"' -f2)
          test -n "$JS_PATH"
          test -n "$CSS_PATH"
          JS_PATH="${JS_PATH#./}"
          CSS_PATH="${CSS_PATH#./}"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/js.headers "$BASE/$JS_PATH" -o /tmp/app.js
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/css.headers "$BASE/$CSS_PATH" -o /tmp/app.css
          tr -d '\r' < /tmp/js.headers > /tmp/js.clean
          tr -d '\r' < /tmp/css.headers > /tmp/css.clean
          grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' /tmp/js.clean
          grep -Eiq '^content-type: *text/css' /tmp/css.clean
          test -s /tmp/app.js
          test -s /tmp/app.css
          grep -Fq 'Restorapp' /tmp/app.js
          if grep -Fq 'Restaurant Autopilot' /tmp/app.js; then
            echo "Legacy customer-facing brand found in compiled app"
            exit 1
          fi
          grep -Fq 'INCIDENT CENTER DEMO' /tmp/app.js
          grep -Fq 'Potvrdi proveru' /tmp/app.js
          grep -Fq 'Vrati u queue' /tmp/app.js
          grep -Fq 'Obavesti vlasnika' /tmp/app.js
          grep -Fq 'E2E dry-run' /tmp/app.js
          grep -Fq 'READ-ONLY E2E DRY-RUN' /tmp/app.js
          grep -Fq 'RELEASE GATE DEMO' /tmp/app.js
          grep -Fq 'Meta publish E2E' /tmp/app.js
          grep -Fq 'ACTION HISTORY DEMO' /tmp/app.js
          grep -Fq 'Potvrđen Meta manual review' /tmp/app.js
          grep -Fq 'LAUNCH CENTER DEMO' /tmp/app.js
          grep -Fq 'META PUBLISH READINESS' /tmp/app.js
          grep -Fq 'Direktno Meta objavljivanje je povezano' /tmp/app.js
          PUBLISH_CHUNK=$(grep -oE 'PublishCenter-[A-Za-z0-9_-]+\.js' /tmp/app.js | head -1)
          test -n "$PUBLISH_CHUNK"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$BASE/assets/$PUBLISH_CHUNK" -o /tmp/publish.js
          grep -Fq 'OWNER provera' /tmp/publish.js
          CREATIVE_CHUNK=$(grep -oE 'CreativeHub-[A-Za-z0-9_-]+\.js' /tmp/app.js | head -1)
          test -n "$CREATIVE_CHUNK"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$BASE/assets/$CREATIVE_CHUNK" -o /tmp/creative.js
          if grep -Fq 'restaurant-autopilot-ai-' /tmp/creative.js; then
            echo "Legacy AI download filename found in compiled Creative Hub"
            exit 1
          fi
          echo "Restorapp branding + customer Launch Center Meta readiness + OWNER ops preview markers OK"
          echo "Public preview OK: $BASE/index.html"
