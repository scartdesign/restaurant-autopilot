name: Build Preview Files

on:
  push:
    branches: [main]
    paths-ignore:
      - 'preview-app/**'
  workflow_dispatch:

concurrency:
  group: build-preview-main-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Publish compiled app into repository
        run: |
          rm -rf preview-app
          mkdir -p preview-app
          cp -R dist/. preview-app/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-app package-lock.json
          if git diff --cached --quiet; then
            echo "Preview already current"
          else
            git commit -m "Update compiled preview"
            git push
          fi
      - name: Smoke test immutable public preview
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          BASE="https://raw.githack.com/scartdesign/restaurant-autopilot/$SHA/preview-app"

          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/html.headers "$BASE/index.html" -o /tmp/app.html
          tr -d '\r' < /tmp/html.headers > /tmp/html.clean
          grep -Eiq '^content-type: *text/html' /tmp/html.clean
          grep -Fq '<div id="root"></div>' /tmp/app.html
          grep -Fq 'Restorapp' /tmp/app.html
          if grep -Fq 'Restaurant Autopilot' /tmp/app.html; then
            echo "Legacy customer-facing brand found in preview HTML"
            exit 1
          fi

          JS_PATH=$(grep -oE 'src="./assets/[^"]+\.js"' /tmp/app.html | head -1 | cut -d'"' -f2)
          CSS_PATH=$(grep -oE 'href="./assets/[^"]+\.css"' /tmp/app.html | head -1 | cut -d'"' -f2)
          test -n "$JS_PATH"
          test -n "$CSS_PATH"
          JS_PATH="${JS_PATH#./}"
          CSS_PATH="${CSS_PATH#./}"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/js.headers "$BASE/$JS_PATH" -o /tmp/app.js
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL -D /tmp/css.headers "$BASE/$CSS_PATH" -o /tmp/app.css
          tr -d '\r' < /tmp/js.headers > /tmp/js.clean
          tr -d '\r' < /tmp/css.headers > /tmp/css.clean
          grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' /tmp/js.clean
          grep -Eiq '^content-type: *text/css' /tmp/css.clean
          test -s /tmp/app.js
          test -s /tmp/app.css
          grep -Fq 'Restorapp' /tmp/app.js
          grep -Fq 'Marketing za 7 dana.' /tmp/app.js
          grep -Fq 'Napravi prvu nedelju' /tmp/app.js
          if grep -Fq 'Restaurant Autopilot' /tmp/app.js; then
            echo "Legacy customer-facing brand found in compiled app"
            exit 1
          fi

          CONTENT_CHUNK=$(grep -oE 'SimpleContentStudio-[A-Za-z0-9_-]+\.js' /tmp/app.js | head -1)
          test -n "$CONTENT_CHUNK"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$BASE/assets/$CONTENT_CHUNK" -o /tmp/content.js
          grep -Fq 'RESTORAPP STUDIO' /tmp/content.js
          grep -Fq 'Autopilot ili ručno. Sve na jednom mestu.' /tmp/content.js
          grep -Fq 'Ova nedelja' /tmp/content.js
          grep -Fq 'Kreiraj objavu' /tmp/content.js
          grep -Fq 'DIZAJN OBJAVE' /tmp/content.js
          grep -Fq 'FINALNI PREVIEW' /tmp/content.js
          grep -Fq 'PALETA' /tmp/content.js
          grep -Fq 'TIPOGRAFIJA' /tmp/content.js
          grep -Fq 'Noir Signature' /tmp/content.js
          grep -Fq 'Hero Dish' /tmp/content.js
          grep -Fq 'Magazine Plate' /tmp/content.js
          grep -Fq 'Studio White' /tmp/content.js
          grep -Fq 'Street Impact' /tmp/content.js
          grep -Fq 'Chef Split' /tmp/content.js
          grep -Fq 'Night Poster' /tmp/content.js
          grep -Fq 'Offer Glass' /tmp/content.js
          grep -Fq 'Menu Select' /tmp/content.js
          grep -Fq 'Flash Offer' /tmp/content.js
          grep -Fq 'Lunch Window' /tmp/content.js
          grep -Fq 'Warm Table' /tmp/content.js

          SHARED_CONTENT_CHUNK=$(grep -oE 'simple-content-studio-[A-Za-z0-9_-]+\.js' /tmp/app.js | head -1)
          test -n "$SHARED_CONTENT_CHUNK"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$BASE/assets/$SHARED_CONTENT_CHUNK" -o /tmp/content-shared.js
          grep -Fq 'Great Vibes' /tmp/content-shared.js
          grep -Fq 'Bebas' /tmp/content-shared.js
          grep -Fq -- '--rt-base-font' /tmp/content-shared.js
          grep -Fq -- '--rt-script-font' /tmp/content-shared.js
          grep -Fq 'rtpl-safe-copy' /tmp/content-shared.js

          SCRIPT_PACK_CSS=$(grep -oE 'simple-content-studio-[A-Za-z0-9_-]+\.css' /tmp/app.js | head -1 || true)
          if [ -n "$SCRIPT_PACK_CSS" ]; then
            curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$BASE/assets/$SCRIPT_PACK_CSS" -o /tmp/script-pack.css
            grep -Fq 'aspect-ratio:9/16' /tmp/script-pack.css
          fi

          PUBLISH_CHUNK=$(grep -oE 'PublishCenter-[A-Za-z0-9_-]+\.js' /tmp/app.js | head -1)
          test -n "$PUBLISH_CHUNK"
          curl --max-time 20 --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$BASE/assets/$PUBLISH_CHUNK" -o /tmp/publish.js
          grep -Fq 'Pregledaj. Zakaži. Gotovo.' /tmp/publish.js
          grep -Fq 'Poveži Instagram + Facebook' /tmp/publish.js

          echo "Restorapp current Studio + Autopilot preview markers OK"
          echo "Public preview OK: $BASE/index.html"
