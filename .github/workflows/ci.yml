name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Meta publish safety regression guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MANUAL_REVIEW_REQUIRED' supabase/functions/meta-publisher/index.ts
          grep -Fq 'RETRY_LIMIT_REACHED' supabase/functions/meta-publisher/index.ts
          grep -Fq 'JOB_ALREADY_PROCESSING' supabase/functions/meta-publisher/index.ts
          grep -Fq 'USE_RETRY_FLOW' supabase/functions/meta-publisher/index.ts
          grep -Fq 'PUBLISH_STATE_CHANGED' supabase/functions/meta-publisher/index.ts
      - name: Production E2E dry-run safety guard
        shell: bash
        run: |
          set -euo pipefail
          FILE="supabase/migrations/20260921012000_add_production_e2e_dry_run.sql"
          grep -Fq 'admin_production_e2e_dry_run' "$FILE"
          grep -Fq "'external_calls',false" "$FILE"
          grep -Fq "'publishes',false" "$FILE"
          grep -Fq "'mode','read_only'" "$FILE"
          if grep -Eiq 'net\\.http_(get|post)|http_request|functions/v1/.+body' "$FILE"; then
            echo "Production E2E dry-run must never call an external API"
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*(insert|update|delete)[[:space:]]' "$FILE"; then
            echo "Production E2E dry-run migration contains a data mutation"
            exit 1
          fi
      - name: Customer Launch Center Meta readiness guard
        shell: bash
        run: |
          set -euo pipefail
          FILE="src/components/LaunchCenter.tsx"
          grep -Fq "action:'status'" "$FILE"
          grep -Fq 'META PUBLISH READINESS' "$FILE"
          grep -Fq 'Poveži Meta publishing' "$FILE"
          grep -Fq "metaConnection?.status==='connected'" "$FILE"
      - name: First-success week flow guard
        shell: bash
        run: |
          set -euo pipefail
          APP="src/App.tsx"
          DASH="src/components/RestorappDashboardV2.tsx"
          grep -Fq 'async function createFirstWeek()' "$APP"
          grep -Fq "action:'preflight'" "$APP"
          grep -Fq "action=preflight?.existing?'week':'ensure_week'" "$APP"
          grep -Fq 'onFirstWeek={createFirstWeek}' "$APP"
          grep -Fq 'SLEDEĆI KORAK' "$DASH"
          grep -Fq "title:'Napravi prvu nedelju'" "$DASH"
          grep -Fq "onNavigate?.('dashboard')" "$DASH"
      - name: Dish template post flow guard
        shell: bash
        run: |
          set -euo pipefail
          FILE="src/components/SimpleContentStudio.tsx"
          APP="src/App.tsx"
          grep -Fq 'Od jela do objave za minut.' "$FILE"
          grep -Fq 'Dodaj jelo' "$FILE"
          grep -Fq 'Kreiraj objavu' "$FILE"
          grep -Fq 'Koristi šablon' "$FILE"
          grep -Fq 'Sačuvaj objavu' "$FILE"
          grep -Fq 'Dupliraj' "$FILE"
          grep -Fq 'Zakaži' "$FILE"
          grep -Fq "from('menu_items').insert" "$FILE"
          grep -Fq "from('restaurant-assets').upload" "$FILE"
          grep -Fq "generation_source:'manual_composer'" "$FILE"
          grep -Fq "onNavigate('publish')" "$FILE"
          grep -Fq "menuItems={menuItems}" "$APP"
          grep -Fq "userId={session.user.id}" "$APP"
          grep -Fq 'BOJE ŠABLONA' "$FILE"
          grep -Fq "name:'Black Gold'" "$FILE"
          grep -Fq 'type="color"' "$FILE"
          grep -Fq "primary_color:primaryColor" "$FILE"
          grep -Fq "accent_color:accentColor" "$FILE"
          RENDERER="src/components/RestaurantTemplateCanvas.tsx"
          PACK="src/restaurant-template-pack.css"
          grep -Fq "case 'luxe'" "$RENDERER"
          grep -Fq "case 'editorial'" "$RENDERER"
          grep -Fq "case 'hero-menu'" "$RENDERER"
          grep -Fq "case 'minimal'" "$RENDERER"
          grep -Fq "case 'bold'" "$RENDERER"
          grep -Fq "case 'poster'" "$RENDERER"
          grep -Fq "case 'split'" "$RENDERER"
          grep -Fq "case 'promo-badge'" "$RENDERER"
          grep -Fq "case 'premium-grid'" "$RENDERER"
          grep -Fq "case 'bold-offer'" "$RENDERER"
          grep -Fq "case 'lunch-time'" "$RENDERER"
          grep -Fq "case 'family'" "$RENDERER"
          grep -Fq '.rtpl-luxe' "$PACK"
          grep -Fq '.rtpl-editorial' "$PACK"
          grep -Fq '.rtpl-family' "$PACK"
      - name: Editable template text slots guard
        shell: bash
        run: |
          set -euo pipefail
          STUDIO="src/components/SimpleContentStudio.tsx"
          RENDERER="src/components/RestaurantTemplateCanvas.tsx"
          CONFIG="src/template-slot-config.ts"
          TYPES="src/types.ts"
          grep -Fq 'TEKSTOVI NA DIZAJNU' "$STUDIO"
          grep -Fq 'STAVKE U MENIJU' "$STUDIO"
          grep -Fq 'selectedTemplateConfig.textSlots.map' "$STUDIO"
          grep -Fq 'text_slots:{...textSlots}' "$STUDIO"
          grep -Fq 'item_slots:itemSlots.map' "$STUDIO"
          grep -Fq 'textSlots?:Record<string,string>' "$RENDERER"
          grep -Fq 'itemSlots?:Array' "$RENDERER"
          grep -Fq "slot('verticalText'" "$RENDERER"
          grep -Fq "slot('footerText'" "$RENDERER"
          grep -Fq "slot('scriptMain'" "$RENDERER"
          grep -Fq "promo-badge" "$CONFIG"
          grep -Fq "itemSlots" "$CONFIG"
          grep -Fq 'text_slots?: Record<string, string>' "$TYPES"
          grep -Fq 'item_slots?: Array' "$TYPES"
      - name: Template font picker guard
        shell: bash
        run: |
          set -euo pipefail
          STUDIO="src/components/SimpleContentStudio.tsx"
          DEMO="src/components/DemoScreen.tsx"
          RENDERER="src/components/RestaurantTemplateCanvas.tsx"
          FONTS="src/template-fonts.ts"
          TYPES="src/types.ts"
          PACK="src/restaurant-template-pack.css"
          grep -Fq 'FONTOVI' "$STUDIO"
          grep -Fq 'Osnovni font' "$STUDIO"
          grep -Fq 'Pisani font' "$STUDIO"
          grep -Fq 'base_font:baseFont' "$STUDIO"
          grep -Fq 'script_font:scriptFont' "$STUDIO"
          grep -Fq 'baseFont={baseFont}' "$STUDIO"
          grep -Fq 'scriptFont={scriptFont}' "$STUDIO"
          grep -Fq 'FONTOVI' "$DEMO"
          grep -Fq 'Pisani font' "$DEMO"
          grep -Fq -- '--rt-base-font' "$RENDERER"
          grep -Fq -- '--rt-script-font' "$RENDERER"
          grep -Fq 'base_font?: string' "$TYPES"
          grep -Fq 'script_font?: string' "$TYPES"
          grep -Fq "id:'signature'" "$FONTS"
          grep -Fq "id:'handwritten'" "$FONTS"
          grep -Fq "id:'elegant-script'" "$FONTS"
          grep -Fq "id:'bold-display'" "$FONTS"
          grep -Fq 'var(--rt-script-font' "$PACK"
          grep -Fq 'var(--rt-base-font' "$PACK"
      - name: Template text safety guard
        shell: bash
        run: |
          set -euo pipefail
          RENDERER="src/components/RestaurantTemplateCanvas.tsx"
          PACK="src/restaurant-template-pack.css"
          CONFIG="src/template-slot-config.ts"
          STUDIO="src/components/SimpleContentStudio.tsx"
          DEMO="src/components/DemoScreen.tsx"
          grep -Fq 'rtpl-safe-copy' "$RENDERER"
          grep -Fq 'rtpl-safe-cta' "$RENDERER"
          grep -Fq -- '-webkit-line-clamp:4' "$PACK"
          grep -Fq 'maxLength?:number' "$CONFIG"
          grep -Fq "defaultValue:'ANNUAL MEGA\\nSALE',maxLength:26" "$CONFIG"
          grep -Fq 'maxLength={slot.maxLength}' "$STUDIO"
          grep -Fq 'maxLength={slot.maxLength}' "$DEMO"
          grep -Fq 'Naslovi imaju bezbedan limit da dizajn ostane uredan.' "$STUDIO"
          grep -Fq 'Naslovi imaju bezbedan limit da dizajn ostane uredan.' "$DEMO"
          if grep -Fq '.rtpl-script.rtpl-fit-medium' "$PACK"; then
            echo "Script font must not be auto-shrunk with em overrides"
            exit 1
          fi
      - name: Script clipping regression guard
        shell: bash
        run: |
          set -euo pipefail
          PACK="src/restaurant-template-pack.css"
          RENDERER="src/components/RestaurantTemplateCanvas.tsx"
          grep -Fq 'Script safe-zones' "$PACK"
          grep -Fq '.rtpl-bottom-band,.rtpl-steak-panel,.rtpl-side-panel,.rtpl-sale-left{overflow:visible}' "$PACK"
          grep -Fq '.rtpl-luxe .rtpl-bottom-band .rtpl-script' "$PACK"
          grep -Fq '.rtpl-bold-offer .rtpl-side-panel .rtpl-script' "$PACK"
          grep -Fq '.rtpl-lunch-time .rtpl-sale-left .rtpl-script' "$PACK"
          if grep -Fq '.rtpl-bottom-band,.rtpl-mini-copy,.rtpl-right-copy,.rtpl-left-copy,.rtpl-steak-panel,.rtpl-white-card,.rtpl-menu-copy,.rtpl-side-panel,.rtpl-sale-left,.rtpl-special-copy{overflow:hidden}' "$PACK"; then
            echo "Script containers are clipped again"
            exit 1
          fi
      - name: Premium content studio guard
        shell: bash
        run: |
          set -euo pipefail
          STUDIO="src/components/SimpleContentStudio.tsx"
          DEMO="src/components/DemoScreen.tsx"
          CSS="src/simple-content-studio.css"
          FONTS="src/template-fonts.ts"
          PACK="src/restaurant-template-pack.css"
          grep -Fq 'FINALNI PREVIEW' "$STUDIO"
          grep -Fq 'dts-editor-tabs' "$STUDIO"
          grep -Fq "editorPanel==='text'" "$STUDIO"
          grep -Fq "editorPanel==='style'" "$STUDIO"
          grep -Fq "editorPanel==='fonts'" "$STUDIO"
          grep -Fq 'Dodatni tekstovi šablona' "$STUDIO"
          grep -Fq 'FINALNI PREVIEW' "$DEMO"
          grep -Fq 'dts-composer-premium' "$DEMO"
          grep -Fq 'Premium Content Studio — sales-ready visual polish' "$CSS"
          grep -Fq 'DM Sans' "$FONTS"
          grep -Fq 'Great Vibes' "$FONTS"
          grep -Fq 'Bebas' "$FONTS"
          grep -Fq 'Premium refinement — cleaner, more commercial restaurant compositions' "$PACK"
      - name: Simplified customer UX guard
        shell: bash
        run: |
          set -euo pipefail
          APP="src/App.tsx"
          PUB="src/components/PublishCenter.tsx"
          grep -Fq 'className="simple-primary-nav"' "$APP"
          grep -Fq '> Početna</button>' "$APP"
          grep -Fq '> Sadržaj</button>' "$APP"
          grep -Fq '> Objave</button>' "$APP"
          grep -Fq '> Meni</button>' "$APP"
          grep -Fq '> Podešavanja</button>' "$APP"
          grep -Fq 'Još alata' "$APP"
          grep -Fq 'publish-social-simple' "$PUB"
          grep -Fq "advancedOpen?'Sakrij napredno':'Napredno'" "$PUB"
          grep -Fq 'Pregledaj. Zakaži. Gotovo.' "$PUB"
          grep -Fq "Dizajn je sada u Sadržaj → Šabloni" "$APP"
          if grep -Fq "mobileGo('studio')" "$APP"; then
            echo "Duplicate Visual Studio must not be visible in customer navigation"
            exit 1
          fi
          if grep -Fq "<VisualStudio" "$APP"; then
            echo "Duplicate Visual Studio must not render as a customer screen"
            exit 1
          fi
      - name: Onboarding starter menu guard
        shell: bash
        run: |
          set -euo pipefail
          FILE="src/components/Onboarding.tsx"
          grep -Fq "Math.min(4,value+1)" "$FILE"
          grep -Fq "label:'Prva jela'" "$FILE"
          grep -Fq 'Prva jela za Autopilot' "$FILE"
          grep -Fq "eventType:'onboarding_menu_seeded'" "$FILE"
          grep -Fq 'marketing_priority:index===0?3:index===1?2:1' "$FILE"
          grep -Fq 'invalidStarterPrice' "$FILE"
          grep -Fq 'chooseStarterDishPhoto' "$FILE"
          grep -Fq "maxSide:1800,quality:.88" "$FILE"
          grep -Fq "update({image_url:imageUrl})" "$FILE"
      - name: Demo dish template flow guard
        shell: bash
        run: |
          set -euo pipefail
          FILE="src/components/DemoScreen.tsx"
          grep -Fq 'Od jela do objave za minut.' "$FILE"
          grep -Fq 'Dodaj jelo' "$FILE"
          grep -Fq 'Kreiraj objavu' "$FILE"
          grep -Fq 'Koristi šablon' "$FILE"
          grep -Fq 'Sačuvaj objavu' "$FILE"
          grep -Fq 'Dupliraj' "$FILE"
          grep -Fq 'Zakaži' "$FILE"
          grep -Fq '<Rocket size={18} /> Početna' "$FILE"
          grep -Fq '<CalendarDays size={18} /> Sadržaj' "$FILE"
          grep -Fq 'BOJE ŠABLONA' "$FILE"
          grep -Fq "name:'Black Gold'" "$FILE"
          grep -Fq 'type="color"' "$FILE"
      - name: Demo Meta connection safety guard
        shell: bash
        run: |
          set -euo pipefail
          FILE="src/components/DemoScreen.tsx"
          grep -Fq "type DemoConnectionStatus='connected'|'expiring'|'expired'|'disconnected'" "$FILE"
          grep -Fq 'META TOKEN WARNING DEMO' "$FILE"
          grep -Fq 'Ponovo poveži Meta' "$FILE"
          grep -Fq 'Publishing je bezbedno blokiran' "$FILE"
          grep -Fq 'disabled={!metaReady}' "$FILE"
      - name: OWNER audit feed read-only guard
        shell: bash
        run: |
          set -euo pipefail
          FILE="supabase/migrations/20260921020000_add_owner_audit_feed.sql"
          grep -Fq 'admin_owner_audit_feed' "$FILE"
          grep -Fq 'from public.admin_audit_log' "$FILE"
          grep -Fq 'if not private.is_superadmin()' "$FILE"
          if grep -Eiq '^[[:space:]]*(insert|update|delete)[[:space:]]' "$FILE"; then
            echo "OWNER audit feed must remain read-only"
            exit 1
          fi
      - name: Checkout and Restorapp branding regression guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'service.from("app_controls").select("sales_open")' supabase/functions/checkout-order/index.ts
          grep -Fq 'STRIPE_NOT_LIVE' supabase/functions/checkout-order/index.ts
          grep -Fq 'service.rpc("service_create_sales_order"' supabase/functions/checkout-order/index.ts
          if grep -Fq 'userClient.rpc("create_sales_order"' supabase/functions/checkout-order/index.ts; then
            echo "Direct customer order RPC bypass is forbidden"
            exit 1
          fi
          if grep -Fq 'sales_settings").select("terms_url,privacy_url,sales_open' supabase/functions/checkout-order/index.ts; then
            echo "checkout-order must not read sales_open from sales_settings"
            exit 1
          fi
          if grep -R -n -F 'Restaurant Autopilot' src public supabase/functions; then
            echo "Legacy customer-visible brand found outside migrations"
            exit 1
          fi
