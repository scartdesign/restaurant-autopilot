name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Smoke test raw.githack preview
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githack.com/scartdesign/restaurant-autopilot/main/preview-app"
          curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL -D /tmp/html.headers "$BASE/index.html" -o /tmp/app.html
          tr -d '\r' < /tmp/html.headers > /tmp/html.clean
          cat /tmp/html.clean
          grep -Eiq '^content-type: *text/html' /tmp/html.clean
          grep -Fq '<div id="root"></div>' /tmp/app.html
          JS_PATH=$(grep -oE 'src="./assets/[^"]+\.js"' /tmp/app.html | head -1 | cut -d'"' -f2)
          CSS_PATH=$(grep -oE 'href="./assets/[^"]+\.css"' /tmp/app.html | head -1 | cut -d'"' -f2)
          test -n "$JS_PATH"
          test -n "$CSS_PATH"
          JS_PATH="${JS_PATH#./}"
          CSS_PATH="${CSS_PATH#./}"
          curl -fsSL -D /tmp/js.headers "$BASE/$JS_PATH" -o /tmp/app.js
          curl -fsSL -D /tmp/css.headers "$BASE/$CSS_PATH" -o /tmp/app.css
          tr -d '\r' < /tmp/js.headers > /tmp/js.clean
          tr -d '\r' < /tmp/css.headers > /tmp/css.clean
          grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' /tmp/js.clean
          grep -Eiq '^content-type: *text/css' /tmp/css.clean
          test -s /tmp/app.js
          test -s /tmp/app.css
