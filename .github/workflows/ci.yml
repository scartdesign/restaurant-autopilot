name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Smoke test Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          URL="https://restaurant-autopilot-54szvlv45-office-5450s-projects.vercel.app/?demo=1"
          curl --retry 12 --retry-delay 5 --retry-all-errors -fsSL -D /tmp/headers.txt "$URL" -o /tmp/app.html
          tr -d '\r' < /tmp/headers.txt > /tmp/headers.clean
          cat /tmp/headers.clean
          grep -Eiq '^content-type: *text/html' /tmp/headers.clean
          grep -Fq '<div id="root"></div>' /tmp/app.html
          JS_PATH=$(grep -oE 'src="./assets/[^"]+\.js"' /tmp/app.html | head -1 | cut -d'"' -f2)
          test -n "$JS_PATH"
          JS_PATH="${JS_PATH#./}"
          curl -fsSL -D /tmp/js-headers.txt "https://restaurant-autopilot-54szvlv45-office-5450s-projects.vercel.app/$JS_PATH" -o /tmp/app.js
          tr -d '\r' < /tmp/js-headers.txt > /tmp/js-headers.clean
          grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' /tmp/js-headers.clean
          test -s /tmp/app.js
