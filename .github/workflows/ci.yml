name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Sync public preview
        run: |
          curl -fsS -X POST "https://pkbsveezmjkvfuiplrqb.supabase.co/functions/v1/publish-static" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Smoke test public app
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://pkbsveezmjkvfuiplrqb.supabase.co/storage/v1/object/public/restaurant-autopilot-preview"
          URL="$BASE/index.html?demo=1"
          curl -fsSL -D /tmp/headers.txt "$URL" -o /tmp/app.html
          tr -d '\r' < /tmp/headers.txt > /tmp/headers.clean
          cat /tmp/headers.clean
          grep -Eiq '^content-type: *text/html' /tmp/headers.clean
          grep -Fq '<div id="root"></div>' /tmp/app.html
          JS_PATH=$(grep -oE 'src="./assets/[^"]+\.js"' /tmp/app.html | head -1 | cut -d'"' -f2)
          test -n "$JS_PATH"
          JS_PATH="${JS_PATH#./}"
          curl -fsSL -D /tmp/js-headers.txt "$BASE/$JS_PATH" -o /tmp/app.js
          tr -d '\r' < /tmp/js-headers.txt > /tmp/js-headers.clean
          cat /tmp/js-headers.clean
          grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' /tmp/js-headers.clean
          test -s /tmp/app.js
