name: Modernize demo templates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modernize-demo-templates.yml'
      - '.github/scripts/modernize-demo-templates.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply demo premium template patch
        run: python .github/scripts/modernize-demo-templates.py
      - run: npm ci
      - run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DemoScreen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Show premium template directions in demo"
          git push
