name: Update modern visual CI guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-modern-visual-ci.yml'
      - '.github/scripts/update-modern-visual-ci.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update visual regression guard
        run: python .github/scripts/update-modern-visual-ci.py
      - name: Commit CI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "Protect modern premium visual system in CI"
          git push
