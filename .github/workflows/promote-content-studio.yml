name: Promote Content Studio

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/promote-content-studio.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python .github/scripts/promote-content-studio.py
      - run: npm ci
      - run: npm run build
      - name: Commit studio positioning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SimpleContentStudio.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Promote Content Studio as a primary workflow"
          git push