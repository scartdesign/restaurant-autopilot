name: Upgrade premium template library

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/upgrade-template-library.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python .github/scripts/upgrade-template-library.py
      - run: npm ci
      - run: npm run build
      - name: Commit premium template library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SimpleContentStudio.tsx src/components/RestaurantTemplateCanvas.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Expand premium restaurant template library"
          git push